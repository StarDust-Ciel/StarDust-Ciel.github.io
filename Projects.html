<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" href="https://win98icons.alexmeub.com/icons/png/computer_explorer_2k-2.png">
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPortal</title>
    <style>
      body {
        background-image: url('https://sadhost.neocities.org/images/tiles/water2.webp');
        cursor: url("https://win98icons.alexmeub.com/icons/png/mouse_ms-1.png"), auto !important;
        margin: 0;
        padding: 0;              
}


      body, a, li, ul, img, button {
        cursor: url("https://win98icons.alexmeub.com/icons/png/mouse_ms-1.png"), auto !important;
      }

      a {
        text-decoration: none !important;
        color: inherit;
      }

      ul[role="menubar"] {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        list-style: none;
        padding: 0;
        margin: 0;
        justify-content: center;
      }

      ul[role="menubar"] li {
        display: inline-block;
      }

      ul[role="menubar"] a {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        color: black;
        border-radius: 2px;
      }

      ul[role="menubar"] a:hover {
        color: black;
      }

      ul[role="menubar"] img {
        vertical-align: middle;
      }

      :root {
        --colorShadeA: rgb(59, 124, 173);
        --colorShadeB: rgb(44, 93, 130);
        --colorShadeC: rgb(26, 55, 77);
        --colorShadeD: rgb(76, 108, 133);
        --colorShadeE: rgb(116, 161, 196);
      }

      button {
        display: inline-block;
        outline: none;
        border: 0;
        font-size: 1.2rem;
        color: var(--colorShadeA);
        font-weight: 700;
        text-transform: uppercase;
        font-family: inherit;
      }

      button.big-button {
        padding: 1em 2em;
        border: 2px solid var(--colorShadeA);
        border-radius: 1em;
        background: var(--colorShadeE);
        transform-style: preserve-3d;
        transition: all 175ms cubic-bezier(0, 0, 1, 1);
        position: relative;
        margin: 0.5em;
      }

      button.big-button::before {
        position: absolute;
        content: "";
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: var(--colorShadeC);
        border-radius: inherit;
        box-shadow: 0 0 0 2px var(--colorShadeB), 0 0.75em 0 0 var(--colorShadeA);
        transform: translate3d(0, 0.75em, -1em);
        transition: all 175ms cubic-bezier(0, 0, 1, 1);
      }

      button.big-button:hover {
        background: var(--colorShadeD);
        transform: translate(0, 0.375em);
      }

      button.big-button:active {
        transform: translate(0em, 0.75em);
      }

      button.big-button:active::before {
        transform: translate3d(0, 0, -1em);
        box-shadow: 0 0 0 2px var(--colorShadeB), 0 0.25em 0 0 var(--colorShadeB);
      }

      .button-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
        text-align: center;
      }

      .column.middle {
      display: flex;
      justify-content: center;
      margin: 1rem auto;
      max-width: 50%;
    }

    .window {
      width: 100%;
    }

    @media (max-width: 900px) {
      .column.middle {
        max-width: 95%;
      }
    }

    @keyframes popIn {
      0%   { transform: scale(0.85); opacity: 0; filter: blur(6px); }
      60%  { transform: scale(1.03); opacity: 1; filter: blur(0); }
      100% { transform: scale(1); opacity: 1; filter: none; }
    }

    .pop {
      animation: popIn 550ms cubic-bezier(.2,.9,.3,1) both;
    }

    .pop.stagger {
      animation-delay: var(--delay, 0ms);
    }
      
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const windows = document.querySelectorAll('.window');
        windows.forEach((w, idx) => {
          const delay = 80 + 80 * idx;
          w.classList.add('pop', 'stagger');
          w.style.setProperty('--delay', `${delay}ms`);
        });
      });
    </script>

   
    <style>
      #projects {
        padding: 60px 20px 80px;
        text-align: center;
      }

      #projects h2 {
        color: #fff;
        text-shadow: 2px 2px 6px #000;
        font-size: 2rem;
        margin-bottom: 30px;
      }

      .portfolio-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }

      .portfolio-item {
        position: relative;
        width: 260px;
        height: 260px;
        overflow: hidden;
        border: 4px solid #c0c0c0;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
      }

      .portfolio-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        -webkit-clip-path: inset(-1px);
        clip-path: inset(-1px);
        transition: -webkit-clip-path 0.25s ease-out;
        transition: clip-path 0.25s ease-out;
      }

      .portfolio-item:hover .portfolio-img {
        -webkit-clip-path: inset(1rem);
        clip-path: inset(1rem);
      }

      .portfolio-item .caption {
        position: absolute;
        inset: 0;
        display: flex;
        background-color: rgba(33, 37, 41, 0.2);
        -webkit-clip-path: inset(0px);
        clip-path: inset(0px);
        transition: -webkit-clip-path 0.25s ease-out, background-color 0.25s;
        transition: clip-path 0.25s ease-out, background-color 0.25s;
      }

      .portfolio-item:hover .caption {
        background-color: rgba(41, 136, 188, 0.9);
        -webkit-clip-path: inset(1rem);
        clip-path: inset(1rem);
      }

      .portfolio-item .caption-content {
        color: #fff;
        margin: auto 1.5rem 1.5rem;
        text-shadow: 0 0 20px #000;
        opacity: 0;
        transition: opacity 0.25s;
      }

      .portfolio-item:hover .caption-content {
        opacity: 1;
        text-shadow: none;
      }

      .portfolio-item .caption-content h4 {
        margin: 0 0 6px;
        color: #fcbc1d;
      }

      .portfolio-item .caption-content p {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.3rem;
      }

      
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 9999;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.active {
        display: flex;
      }

      .portfolio-window {
        display: none;
        width: 420px;
        max-width: 90vw;
        max-height: 85vh;
        overflow-y: auto;
      }

      .portfolio-window.active {
        display: block;
      }

      .portfolio-window .window-body img {
        max-width: 100%;
        display: block;
        margin: 10px 0;
      }
    </style>
  </head>

  <body>

    <!-- Menu bar -->
    <ul role="menubar">
      <li role="menuitem"><a href="index.html"><img src="https://win98icons.alexmeub.com/icons/png/homepage_alt.png" width="16" height="16">Home</a></li>
      <li role="menuitem"><a href="Projects.html"><img src="https://win98icons.alexmeub.com/icons/png/console_prompt-0.png" width="16" height="16">Projects</a></li>
      <li role="menuitem"><a href="writings.html"><img src="https://win98icons.alexmeub.com/icons/png/desktop_w95-0.png" width="16" height="16">Writings</a></li>
      <li role="menuitem"><a href="online.html"><img src="https://win98icons.alexmeub.com/icons/png/address_book_card.png" width="16" height="16">Certificates</a></li>
      <li role="menuitem"><a href="links.html"><img src="https://win98icons.alexmeub.com/icons/png/address_book_user.png" width="16" height="16">Links</a></li>
      <li role="menuitem"><a href="resources.html"><img src="https://win98icons.alexmeub.com/icons/png/help_book_big-1.png" width="16" height="16">Resources</a></li>
    </ul>


    

    <!-- Projects -->
    <section id="projects">
      <div class="portfolio-grid">

        <div class="portfolio-item" data-modal="portfolioModal1">
          <img class="portfolio-img" src="https://www.ericwadkins.com/img/neural_model.png" alt="Neural Model Library">
          <div class="caption">
            <div class="caption-content">
              <h4>Intrusion Detection System</h4>
              <p>...</p>
            </div>
          </div>
        </div>

        <div class="portfolio-item" data-modal="portfolioModal2">
          <img class="portfolio-img" src="https://www.ericwadkins.com/img/nn_trainer.png" alt="NN Trainer Library">
          <div class="caption">
            <div class="caption-content">
              <h4>Personal web</h4>
              <p>...</p>
            </div>
          </div>
        </div>

      </div>
    </section>

    
    <div class="modal-overlay" id="modalOverlay">

      <div class="window portfolio-window" id="portfolioModal1">
        <div class="title-bar">
          <div class="title-bar-text">Intrusion Detection System</div>
          <div class="title-bar-controls">
            <button aria-label="Close" class="modal-close-btn"></button>
          </div>
        </div>
        <div class="window-body">
          <p>....</p>
          <p>... </p>
          <p><b>GitHub:</b> <a href="" target="_blank">..</a></p>
        </div>
      </div>

      <div class="window portfolio-window" id="portfolioModal2">
        <div class="title-bar">
          <div class="title-bar-text">Personal web</div>
          <div class="title-bar-controls">
            <button aria-label="Close" class="modal-close-btn"></button>
          </div>
        </div>
        <div class="window-body">
          <p>...</p>
          <p>...</p>
          <p><b>GitHub:</b> <a href="" target="_blank">...</a></p>
        </div>
      </div>

    </div>

   
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const overlay = document.getElementById('modalOverlay');
        const items = document.querySelectorAll('.portfolio-item');
        const windowsEls = document.querySelectorAll('.portfolio-window');

        function openModal(id) {
          windowsEls.forEach(w => w.classList.remove('active'));
          const target = document.getElementById(id);
          if (target) {
            target.classList.add('active');
            overlay.classList.add('active');
          }
        }

        function closeModal() {
          overlay.classList.remove('active');
          windowsEls.forEach(w => w.classList.remove('active'));
        }

        items.forEach(item => {
          item.addEventListener('click', () => openModal(item.getAttribute('data-modal')));
        });

        document.querySelectorAll('.modal-close-btn').forEach(btn => {
          btn.addEventListener('click', closeModal);
        });

        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeModal();
        });
      });
    </script>

</body>
</html>
